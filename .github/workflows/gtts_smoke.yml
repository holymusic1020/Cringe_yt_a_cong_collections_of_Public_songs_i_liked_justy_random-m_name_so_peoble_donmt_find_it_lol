name: gtts-smoke
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get -qq install -y ffmpeg
      - name: Voice matrix — every Gemini voice the cast uses
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          import gtts
          from pathlib import Path
          Path("/tmp/g").mkdir(exist_ok=True)
          line = "One paper. That is all it took. Twenty years, gone by morning."
          voices = ["Charon", "Puck", "Kore", "Orion", "Leda", "Aoede",
                    "Fenrir", "Ichor"]
          ok = {}
          for v in voices:
            r = gtts._post(f"Read with real feeling: {line}", v,
                           Path(f"/tmp/g/{v}.mp3"), 200, label=v)
            ok[v] = r
            print(f"MATRIX {v}: {'OK' if r else 'FAIL'}")
          good = [v for v, r in ok.items() if r]
          print("VERDICT good:", good)
          print("VERDICT bad:", [v for v, r in ok.items() if not r])
          assert len(good) >= 4, "too many voices broken"
          EOF
