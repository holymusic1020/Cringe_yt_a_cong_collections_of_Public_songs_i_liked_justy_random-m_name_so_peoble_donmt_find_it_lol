name: pool-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"  # weekly Sunday refresh (keeps pool varied)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get -qq install -y ffmpeg
      - name: Build story-matched HD pool from Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 scripts/refresh_pool.py
      - name: Swap release assets (UPLOAD FIRST, delete-after — the Sep 27
              wipe deleted the whole pool then failed to upload anything)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          built=$(ls pool_out/pool_*.mp4 2>/dev/null | wc -l)
          if [ "$built" -lt 3 ]; then
            echo "!! only $built clips built — ABORTING, existing pool untouched" >&2
            exit 1
          fi
          gh release upload bg-archive pool_out/pool_*.mp4 --clobber
          # only now remove stale assets that this build did not replace
          keep=$(cd pool_out && ls pool_*.mp4)
          for A in $(gh release view bg-archive --json assets -q '.assets[].name' | grep '^pool_'); do
            echo "$keep" | grep -qx "$A" || gh release delete-asset bg-archive "$A" --yes || true
          done
          echo "final pool:"; gh release view bg-archive --json assets -q '.assets[].name' | grep '^pool_' 
