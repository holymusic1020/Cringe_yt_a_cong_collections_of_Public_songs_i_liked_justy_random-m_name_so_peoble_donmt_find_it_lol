name: render

# Continuous production (boss architecture): render on GH Actions = no resource
# limits. Every finished episode -> boss's Telegram + 90-day artifact vault.
# post.yml later feeds YouTube from the vault on the constitution cadence.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "ep script filename (blank = oldest unrendered in queue)"
        type: string
        default: ""
  schedule:
    - cron: "33 1,13 * * *" # 2x/day, off-peak, keeps vault >=1 ahead

permissions:
  contents: read

concurrency:
  # scheduled runs serialize together; manual dispatches run free in parallel
  # (rapid dispatches into one busy group supersede-cancel older pending runs)
  group: ${{ github.event_name == 'schedule' && 'render-cron' || format('render-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core

      - run: pip install -q edge-tts yt-dlp pillow requests

      - name: Install deno (yt-dlp JS runtime — YouTube bg extraction needs it on datacenter IPs)
        run: |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -o /tmp/deno.zip -d /tmp/denobin
          sudo install -m 755 /tmp/denobin/deno /usr/local/bin/deno
          deno --version

      - name: Fetch real-video bg pool (release assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/bg_pool
          gh release download bg-archive --repo "$GITHUB_REPOSITORY" --pattern "pool_*.mp4" --dir assets/bg_pool --clobber \
            || echo "bg pool unavailable — providers will fall through"
          ls -la assets/bg_pool 2>/dev/null || true

      - name: Render episode (queue FIFO)
        run: |
          SCRIPT="${{ inputs.script }}"
          if [ -n "$SCRIPT" ]; then
            python3 src/make_episode.py "scripts/queue/$SCRIPT"
          else
            python3 src/make_episode.py
          fi

      - name: Strict QA (per-window sticker/robot/karaoke proof)
        run: |
          for f in output/*_timeline.json; do
            vid="${f%_timeline.json}.mp4"
            python3 scripts/qa_strict.py "$vid" "$f"
          done

      - name: Vault it (90-day artifact = render-ahead buffer)
        uses: actions/upload-artifact@v4
        with:
          name: vault-${{ github.run_id }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*_meta.json
            output/*_timeline.json
          retention-days: 90
          if-no-files-found: error
