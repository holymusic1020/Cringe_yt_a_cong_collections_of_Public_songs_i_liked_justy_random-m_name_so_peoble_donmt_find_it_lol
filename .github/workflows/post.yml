name: post

# MANUAL-ONLY (boss order Sep 9: no auto pushes — spam-flag protection.
# Videos go to Telegram; boss posts via dispatch when ready.)

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "episode stem (e.g. ep001) — blank = FIFO vault"
        type: string
        default: ""
      force:
        description: "ignore the cadence window"
        type: boolean
        default: false
  schedule:
    # GitHub cron is chronically 1-3h late and sometimes drops slots
    # entirely (found Sep 24: the 21:07 Dhaka slot never fired). So: check
    # every 30 min through the Dhaka evening — the window-guard makes all
    # but the first check no-ops, so the daily post lands 21:07-21:37 Dhaka
    # even when individual crons vanish. Morning slot = safety catch-up.
    - cron: "7,37 14-20 * * *"
    - cron: "19 3 * * *"
                           # video goes public daily; post_job's 15-19h
                           # window still guards against double-posting

permissions:
  contents: write   # state commits
  actions: read     # artifact downloads

concurrency:
  group: post-engine
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # artifact API + state push
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q requests pillow

      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg

      - name: Preflight — verify channel binding (constitution §D)
        run: python3 src/preflight.py

      - name: Post one episode (cadence window respected)
        env:
          EPISODE: ${{ inputs.episode }}
          FORCE: ${{ inputs.force }}
        run: |
          # inputs come via ENV — bare GH expressions inlined into shell
          # break on scheduled runs (empty force -> leading && syntax error;
          # found Sep 23: every scheduled post died in 27s since cron added)
          ARGS=""
          if [ -n "$EPISODE" ]; then ARGS="--episode $EPISODE"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 src/post_job.py $ARGS
